
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Basics</title>

    <style>
        body {
            background-color: pink;
            margin: 0;
        }

        h1 {
            color: white;
            text-align: center;
        }

        .shops {
            display: flex;
            justify-content: center;
            gap: 30px;
            text-align: center;
        }

        .shop {
            width: 300px;
        }

        .shop img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .copyright {
            text-align: right;
            font-family: monospace;
            font-style: italic;
        }
    </style>
</head>

<body>
    <h1>Online Shops ★</h1>

    <div class="shops">

        <div class="shop">
            <img src="https://m.media-amazon.com/images/G/01/sell/images/prime-boxes/prime-boxes-2.png" alt="Online Shop 1">
            <br>
            <a href="https://www.amazon.com">Amazon</a>
        </div>

        <div class="shop">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRt2EHyRrtOQV_63LXMbgfhn8ZnIBvw19GR-PNVMU7tmRulLNSJ-wmuMmYt&s=10" alt="Online Shop 2">
            <br>
            <a href="https://www.ebay.com">eBay</a>
        </div>

    </div>

    <hr>

    <p class="copyright">© wil 2026</p>

</body>
</html>
